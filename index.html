<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unity Alpha Sprite Sheet Gen</title>

    <script>
        if (!window.crossOriginIsolated) {
            if (typeof window !== 'undefined' && 'serviceWorker' in navigator) {
                const swUrl = 'coi-serviceworker.js';
                navigator.serviceWorker.register(swUrl).then(registration => {
                    registration.addEventListener('updatefound', () => {
                        location.reload();
                    });
                    if (registration.active) {
                        location.reload();
                    }
                });
            }
        }
    </script>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .field { margin-bottom: 18px; }
        label { display: block; font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 6px; letter-spacing: 1px; }
        input { width: 100%; padding: 10px; background: #252525; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #05a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #007bff; }
        #status { margin-top: 15px; font-size: 13px; color: #00ffcc; text-align: center; }
        #output { margin-top: 30px; display: none; text-align: center; }
        img { max-width: 100%; border: 2px solid #333; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 20px 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sprite Sheet Gen</h2>
    <div class="field">
        <label>Video Input (WebM/VP8 Alpha)</label>
        <input type="file" id="videoFile" accept=".webm,.mov">
    </div>
    <div style="display: flex; gap: 10px;">
        <div class="field" style="flex: 1;">
            <label>Columns</label>
            <input type="number" id="cols" value="4">
        </div>
        <div class="field" style="flex: 1;">
            <label>Total Frames</label>
            <input type="number" id="frameCount" value="16">
        </div>
    </div>
    <button id="startBtn">Build PNG Sprite Sheet</button>
    <div id="status">Initializing Engine... (If stuck, refresh)</div>
</div>

<div id="output">
    <label>Result (Right-click to save)</label><br>
    <img id="preview">
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({ log: true });

    async function init() {
        try {
            await ffmpeg.load();
            document.getElementById('status').innerText = "Ready";
        } catch (e) {
            document.getElementById('status').innerText = "Error: Security block. Try refreshing.";
        }
    }

    init();

    document.getElementById('startBtn').onclick = async () => {
        const file = document.getElementById('videoFile').files[0];
        const cols = document.getElementById('cols').value;
        const total = document.getElementById('frameCount').value;

        if (!file) return alert("Select a file");

        document.getElementById('status').innerText = "Processing...";
        ffmpeg.FS('writeFile', 'input', await fetchFile(file));

        await ffmpeg.run(
            '-i', 'input',
            '-vf', `tile=${cols}x${Math.ceil(total/cols)}`,
            '-frames:v', '1',
            'sheet.png'
        );

        const data = ffmpeg.FS('readFile', 'sheet.png');
        document.getElementById('preview').src = URL.createObjectURL(new Blob([data.buffer], { type: 'image/png' }));
        document.getElementById('output').style.display = 'block';
        document.getElementById('status').innerText = "Done!";
    };
</script>
</body>
</html>
