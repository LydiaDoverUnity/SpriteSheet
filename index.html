<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Alpha Sprite Sheet Gen v3</title>
    <script src="coi-serviceworker.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 24px; width: 100%; max-width: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fff; text-align: center; font-size: 1.2em; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 10px; text-transform: uppercase; color: #888; margin-bottom: 4px; letter-spacing: 1px; }
        input, select { width: 100%; padding: 10px; background: #252525; border: 1px solid #333; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        button { width: 100%; padding: 14px; background: #0066ff; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0052cc; }
        button:disabled { background: #444; cursor: not-allowed; }
        
        /* Progress Bar Styles */
        .progress-container { margin-top: 20px; display: none; width: 100%; }
        .progress-bg { background: #333; height: 12px; border-radius: 6px; overflow: hidden; width: 100%; }
        #progress-fill { background: #00ffcc; height: 100%; width: 0%; transition: width 0.2s; }
        #percent-text { display: block; text-align: center; font-size: 12px; margin-top: 5px; color: #00ffcc; }

        #status { margin-top: 15px; font-size: 12px; color: #bbb; text-align: center; font-family: monospace; min-height: 1.2em; }
        #output { margin-top: 30px; display: none; text-align: center; width: 100%; }
        #preview { 
            max-width: 100%; border: 2px solid #444; 
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Sprite Sheet Gen v3</h2>
    
    <div class="field">
        <label>Video Input</label>
        <input type="file" id="videoFile" accept=".webm,.mov">
    </div>

    <div class="grid-inputs">
        <div class="field">
            <label>Columns</label>
            <input type="number" id="cols" value="4">
        </div>
        <div class="field">
            <label>Frame Step</label>
            <input type="number" id="step" value="1" min="1">
        </div>
    </div>

    <div class="grid-inputs">
        <div class="field">
            <label>Max Frames</label>
            <input type="number" id="frameCount" value="16">
        </div>
        <div class="field">
            <label>Compression</label>
            <select id="quality">
                <option value="0">Lossless</option>
                <option value="15">High Quality</option>
                <option value="25" selected>Balanced</option>
                <option value="40">Small</option>
            </select>
        </div>
    </div>

    <button id="startBtn">Generate Sprite Sheet</button>

    <div class="progress-container" id="progContainer">
        <div class="progress-bg"><div id="progress-fill"></div></div>
        <span id="percent-text">0%</span>
    </div>

    <div id="status">Initializing Engine...</div>
</div>

<div id="output">
    <label>Right-click to save PNG</label><br>
    <img id="preview">
</div>

<script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    let targetFrames = 16;
    
    const startBtn = document.getElementById('startBtn');
    const status = document.getElementById('status');
    const progFill = document.getElementById('progress-fill');
    const percentText = document.getElementById('percent-text');
    const progContainer = document.getElementById('progContainer');

    const ffmpeg = createFFmpeg({ 
        log: true,
        // This logger function intercepts FFmpeg output to update the bar
        logger: ({ message }) => {
            if (message.includes('frame=')) {
                const match = message.match(/frame=\s*(\d+)/);
                if (match && match[1]) {
                    const currentFrame = parseInt(match[1]);
                    const progress = Math.min(Math.round((currentFrame / targetFrames) * 100), 99);
                    updateProgress(progress);
                }
            }
        }
    });

    function updateProgress(val) {
        progFill.style.width = val + '%';
        percentText.innerText = val + '%';
    }

    async function loadEngine() {
        try { 
            await ffmpeg.load(); 
            status.innerText = "Ready"; 
        } catch (e) { 
            status.innerText = "Security block. Refresh."; 
        }
    }
    loadEngine();

    startBtn.onclick = async () => {
        const file = document.getElementById('videoFile').files[0];
        const cols = parseInt(document.getElementById('cols').value);
        targetFrames = parseInt(document.getElementById('frameCount').value);
        const step = parseInt(document.getElementById('step').value);
        const crf = document.getElementById('quality').value;

        if (!file) return alert("Select a video");

        startBtn.disabled = true;
        progContainer.style.display = 'block';
        updateProgress(0);
        status.innerText = "Crunching frames...";

        ffmpeg.FS('writeFile', 'input', await fetchFile(file));

        try {
            const filter = `select='not(mod(n\\,${step}))',setpts=N/FRAME_RATE/TB,format=yuva420p,tile=${cols}x${Math.ceil(targetFrames/cols)}`;

            await ffmpeg.run(
                '-vcodec', 'libvpx', 
                '-i', 'input',
                '-vf', filter,
                '-frames:v', '1',
                '-pix_fmt', 'rgba',
                '-crf', crf,
                'sheet.png'
            );

            updateProgress(100);
            const data = ffmpeg.FS('readFile', 'sheet.png');
            document.getElementById('preview').src = URL.createObjectURL(new Blob([data.buffer], { type: 'image/png' }));
            document.getElementById('output').style.display = 'block';
            status.innerText = "Complete!";
        } catch (err) {
            status.innerText = "Error. Check Console.";
        } finally {
            startBtn.disabled = false;
        }
    };
</script>
</body>
</html>
